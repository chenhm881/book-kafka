spring:
  kafka:
    consumer:
      enable-auto-commit: false  # 关闭自动关闭自动提交，避免冲突
    producer:
      transaction-id-prefix: kafka_tx
      acks: -1
      retries: 3
    listener:
      ack-mode: MANUAL_IMMEDIATE  # 启用手动提交模式（必须配置）
    bootstrap-servers: localhost:9092
  datasource:
    # driver-class-name: com.mysql.jdbc.Driver
    driver-class-name: com.mysql.cj.jdbc.Driver
    # url: jdbc:mysql://47.98.163.117:3306/ming_blog
    url: jdbc:mysql://localhost:3306/heiio?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: root
    password: 123456
server:
  port: 9080


mybatis:
  config-location:  classpath:mybatis-config.xml
  type-aliases-package: com.heiio.bookkafka.model.blog



logging:
  level:
    # 设置 Kafka 生产者的日志级别为 DEBUG
    org.apache.kafka.clients.producer: DEBUG
    # 可选：同时开启 Spring Kafka 相关日志（如 KafkaTemplate）
    org.springframework.kafka: INFO  # 或 DEBUG（更详细）